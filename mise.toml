[tools]
go = "1.27.1"
"aqua:tinygo-org/tinygo" = "0.42.0"
"aqua:rhysd/actionlint" = "1.7.12"

[tasks.run]
description = "Run the zero-kb02 emulator"
run = "go run ."

[tasks.run-conf2025badge]
description = "Run the conf2025badge emulator"
env = { RP2040_SIMULATOR_BOARD = "conf2025badge" }
run = "go run ."

[tasks.test]
description = "Run Go tests for the simulator"
run = [
  "go test . ./machine/... ./driver/... ./internal/...",
  "RP2040_SIMULATOR_BOARD=conf2025badge go test ./internal/emulator -count=1",
]

[tasks.lint]
description = "Run static and repository checks"
run = [
  "go vet . ./machine/... ./driver/... ./internal/...",
  "go mod tidy -diff",
  "actionlint",
]

[tasks.check]
description = "Run tests and static checks"
run = [
  "mise run lint",
  "mise run test",
]

[tasks.screenshot]
description = "Capture and verify the emulator UI"
env = {
  EMULATOR_SNAPSHOT = "{{config_root}}/build/emulator.png",
}
run = [
  "mkdir -p build",
  "go test ./internal/emulator -count=1",
  "RP2040_SIMULATOR_BOARD=conf2025badge go test ./internal/emulator -count=1",
]

[tasks.build]
description = "Build the desktop emulator"
run = [
  "mkdir -p build",
  "go build -o build/zero-kb02 .",
]

[tasks.test-audio]
description = "Verify buzzer playback on a desktop with audio output"
env = { RP2040_SIMULATOR_BOARD = "conf2025badge", EMULATOR_TEST_AUDIO = "1" }
run = "go test ./internal/emulator -count=1"

[tasks.build-tinygo]
description = "Build the TinyGo compatibility check"
run = [
  "mkdir -p build",
  "tinygo build -target=waveshare-rp2040-zero -o build/tinygo-check.uf2 ./testdata/tinygo",
  "tinygo build -target=xiao-rp2040 -o build/tinygo-conf2025badge-check.uf2 ./testdata/tinygo",
]
